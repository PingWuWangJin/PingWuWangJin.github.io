<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>疯狂贪吃蛇</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #e2e8f0;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    padding: 16px;
  }
  .game { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 20px; font-weight: 500; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    background: #1e293b; border-radius: 999px; padding: 4px 12px;
    font-size: 13px; color: #94a3b8;
  }
  .chip b { color: #e2e8f0; font-weight: 500; margin-left: 4px; }
  .chip-btn { border: none; font-family: inherit; cursor: pointer; }
  .challenge {
    width: min(480px, calc(100vw - 32px));
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: #1e293b; border: 1px solid #f59e0b55;
    border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #cbd5e1;
  }
  .challenge b { color: #fbbf24; font-weight: 500; }
  .challenge .x { border: none; background: none; color: #64748b; font-size: 15px; cursor: pointer; }
  .board-wrap { position: relative; }
  canvas {
    display: block;
    width: min(480px, calc(100vw - 32px));
    height: auto;
    touch-action: none;
    background: #101a2e;
    border: 1px solid #24324d;
    border-radius: 12px;
  }
  .float {
    position: absolute; color: #fbbf24; font-size: 14px; font-weight: 500;
    pointer-events: none; transform: translate(-50%, -50%);
    animation: rise .8s ease-out forwards;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  @keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11, 18, 32, .82);
    backdrop-filter: blur(3px);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    padding: 14px;
  }
  .hidden { display: none !important; }
  .page { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .page h2 { font-size: 20px; font-weight: 500; }
  .page p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .ver-grid { display: grid; grid-template-columns: 1fr; gap: 8px; width: 100%; max-width: 400px; }
  .ver-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 12px 14px; text-align: left; font-family: inherit; cursor: pointer;
    color: #e2e8f0;
  }
  .ver-card:hover { border-color: #64748b; }
  .ver-card.active { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e; }
  .ver-card b { font-size: 15px; font-weight: 500; }
  .ver-card small { display: block; font-size: 12px; color: #94a3b8; margin-top: 3px; }
  .gallery {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    width: 100%; max-width: 420px;
  }
  @media (max-width: 480px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
  .g-tile {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: inherit; cursor: pointer;
  }
  .g-tile:hover { border-color: #64748b; }
  .g-tile.active { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e; }
  .g-tile.locked { opacity: .45; }
  .g-bar { width: 80%; height: 8px; border-radius: 5px; }
  .g-name { font-size: 11px; color: #e2e8f0; }
  .g-state { font-size: 11px; color: #94a3b8; }
  .lobby-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-primary {
    background: #22c55e; color: #052e16; border: none;
    border-radius: 8px; padding: 9px 20px;
    font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .btn-primary:hover { background: #4ade80; }
  .btn2 {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 9px 16px;
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .btn2:hover { border-color: #64748b; }
  .nick-input {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 9px 12px; width: 210px;
    font-size: 14px; font-family: inherit; text-align: center;
  }
  .lb-list {
    width: 100%; max-width: 320px; max-height: 250px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 13px; color: #cbd5e1; text-align: left;
  }
  .lb-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 10px; background: #1e293b; border-radius: 8px; }
  .lb-row b { color: #fbbf24; font-weight: 500; }
  .lb-row.me { border: 1px solid #22c55e; }
  .controls { display: flex; gap: 10px; align-items: center; }
  .hint { font-size: 12px; color: #64748b; }
  .skin-line { font-size: 12px; color: #64748b; }
  .ad-card {
    width: 100%; max-width: 340px;
    padding: 22px 16px; border-radius: 14px;
    background: linear-gradient(135deg, #1e3a8a, #5b21b6, #1e3a8a);
    background-size: 200% 200%;
    animation: adbg 3s ease infinite;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  @keyframes adbg { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .ad-icon { font-size: 34px; }
  .ad-text { font-size: 14px; color: #e2e8f0; line-height: 1.6; white-space: pre-line; }
  #reviveGo:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<main class="game">
  <div class="topbar">
    <h1>🐍 疯狂贪吃蛇</h1>
    <div class="chips">
      <button class="chip chip-btn" id="nickBtn" type="button">👤 PWWJ</button>
      <span class="chip">得分<b id="score">0</b></span>
      <span class="chip">最高<b id="best">0</b></span>
    </div>
  </div>
  <div id="challenge" class="challenge hidden">
    <span id="challenge-text"></span>
    <button class="x" id="challenge-x" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="board-wrap" id="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <!-- 页面：首次进入，建立档案 -->
      <div class="page hidden" id="page-nick">
        <h2>🎓 建立你的档案</h2>
        <p>起个名字，用来上排行榜、发挑战链接<br>（存档就在这台设备上）</p>
        <input class="nick-input" id="nick-input" maxlength="12" placeholder="你的名字 / 微信昵称">
        <button class="btn-primary" id="nick-save" type="button">保存并进入</button>
      </div>
      <!-- 页面：版本选择 -->
      <div class="page hidden" id="page-ver">
        <h2>🎮 选择版本</h2>
        <p>同一条蛇，三种玩法，随时可换</p>
        <div class="ver-grid">
          <button class="ver-card" data-v="simple" type="button">
            <b>🐢 简约版</b>
            <small>经典格子走路 · 自撞即死 · 单一食物 · 无减负无复活</small>
          </button>
          <button class="ver-card" data-v="advanced" type="button">
            <b>⚡ 高级版</b>
            <small>灵动滑行 · 自撞即死 · 多种食物 · 无减负无复活</small>
          </button>
          <button class="ver-card" data-v="supreme" type="button">
            <b>👑 至尊版</b>
            <small>灵动滑行 · 穿身无伤 · 多种食物 · 定期减负 · 广告复活</small>
          </button>
        </div>
      </div>
      <!-- 页面：大厅 = 皮肤图鉴 -->
      <div class="page hidden" id="page-lobby">
        <h2>🐍 疯狂贪吃蛇 · 大厅</h2>
        <p id="lobby-hint">点皮肤换装 · 达到分数解锁更牛的款式</p>
        <div class="gallery" id="gallery"></div>
        <div class="lobby-btns">
          <button class="btn-primary" id="btn" type="button">开始游戏</button>
          <button class="btn2" id="verBtn" type="button">🔄 换版本</button>
          <button class="btn2 hidden" id="whiteBtn" type="button">⬜ 白玉棋盘：关</button>
          <button class="btn2" id="lbBtn" type="button">🏆 排行榜</button>
        </div>
      </div>
      <!-- 页面：结算 -->
      <div class="page hidden" id="page-over">
        <h2 id="over-title">游戏结束</h2>
        <p id="over-hint"></p>
        <button class="btn-primary hidden" id="reviveBtn" type="button">📺 看视频复活</button>
        <div class="lobby-btns">
          <button class="btn-primary" id="againBtn" type="button">再来一局</button>
          <button class="btn2" id="shareBtn" type="button">📤 复制挑战链接</button>
          <button class="btn2" id="homeBtn" type="button">大厅</button>
        </div>
      </div>
      <!-- 页面：暂停 -->
      <div class="page hidden" id="page-pause">
        <h2>已暂停</h2>
        <p id="pause-hint"></p>
      </div>
      <!-- 页面：排行榜 -->
      <div class="page hidden" id="page-lb">
        <h2>🏆 排行榜</h2>
        <div class="lb-list" id="lb-list"></div>
        <button class="btn2" id="lbBack" type="button">返回</button>
      </div>
      <!-- 页面：广告时间 -->
      <div class="page hidden" id="page-ad">
        <h2>📺 广告时间</h2>
        <div class="ad-card">
          <div class="ad-icon" id="ad-icon">🤖</div>
          <div class="ad-text" id="ad-text"></div>
        </div>
        <p>广告结束后可复活 · 还剩 <b id="ad-sec">5</b> 秒</p>
        <div class="lobby-btns">
          <button class="btn-primary" id="reviveGo" type="button" disabled>广告 5 秒…</button>
          <button class="btn2" id="adSkip" type="button">✕ 放弃复活</button>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <span class="hint" id="ctrl-hint"></span>
  </div>
  <p class="skin-line" id="skinLine"></p>
  <p class="skin-line" id="statLine"></p>
</main>
<script>
// ---------- 基础设置 ----------
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width;            // 画布 480×480
const GRID = 24;                   // 格子版：24×24 格
const CELL = 20;                   // 格子版：每格 20px
const boardWrap = document.getElementById('board-wrap');

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const nickBtn = document.getElementById('nickBtn');
const challengeEl = document.getElementById('challenge');
const challengeText = document.getElementById('challenge-text');
const challengeX = document.getElementById('challenge-x');
const galleryEl = document.getElementById('gallery');
const lobbyHint = document.getElementById('lobby-hint');
const overTitle = document.getElementById('over-title');
const overHint = document.getElementById('over-hint');
const pauseHint = document.getElementById('pause-hint');
const lbList = document.getElementById('lb-list');
const btn = document.getElementById('btn');
const shareBtn = document.getElementById('shareBtn');
const skinLine = document.getElementById('skinLine');
const statLine = document.getElementById('statLine');
const whiteBtn = document.getElementById('whiteBtn');
const ctrlHint = document.getElementById('ctrl-hint');

// ---------- 在线排行榜开关 ----------
// 国内直连 Supabase 暂时不通，先休眠（游戏其他功能不受影响）。
// 以后装好网络中转（Cloudflare Worker），把下面两行填回去就复活：
//   url: 'https://fxmoctofxglqrahbzddc.supabase.co',
//   key: 'sb_publishable_5vD-hXbxcD_EoKe-IZcXOg_jv_KWC6Y',
const LEADERBOARD = { url: '', key: '' };

// ---------- 解锁门槛（必须在 SKINS 之前声明，数组要用到） ----------
const WHITE_NEED = 3000;       // 累计长度解锁：白玉棋盘（px）
const RAINBOW_NEED = 8000;     // 累计长度解锁：炫彩皮肤（px）

// ---------- 皮肤图鉴：need = 解锁门槛（普通皮肤看最高分，炫彩看累计长度） ----------
const SKINS = [
  { name: '经典绿',   icon: '🌿', head: '#4ade80', body1: '#16a34a', body2: '#15803d', need: 0 },
  { name: '烈焰红',   icon: '🔥', head: '#fca5a5', body1: '#ef4444', body2: '#dc2626', need: 100 },
  { name: '海洋蓝',   icon: '🌊', head: '#7dd3fc', body1: '#0ea5e9', body2: '#0284c7', need: 250 },
  { name: '赛博紫',   icon: '💜', head: '#d8b4fe', body1: '#a855f7', body2: '#9333ea', need: 500 },
  { name: '橘子汽水', icon: '🍊', head: '#fdba74', body1: '#f97316', body2: '#ea580c', need: 900 },
  { name: '暗夜幽灵', icon: '👻', head: '#e2e8f0', body1: '#94a3b8', body2: '#64748b', need: 1500 },
  { name: '炫彩', icon: '🌈', rainbow: true, need: RAINBOW_NEED }, // 特殊：按累计长度解锁，颜色随时间流动
];

// ---------- 食物图鉴：weight = 出现概率权重，score = 分值 ----------
const FOOD_TYPES = [
  { icon: '🍎', name: '苹果', score: 10,  weight: 55, size: 0.78 },
  { icon: '🍇', name: '葡萄', score: 25,  weight: 25, size: 0.66 },
  { icon: '🍊', name: '金桔', score: 50,  weight: 14, size: 0.78 },
  { icon: '⭐', name: '星星', score: 100, weight: 6,  size: 0.88 },
];
const FOOD_COUNT = 3;

// ---------- 三种版本 ----------
const VERSIONS = {
  simple:   { name: '简约版', mode: 'grid',   selfDeath: true,  revive: false, shrink: false, multiFood: false },
  advanced: { name: '高级版', mode: 'smooth', selfDeath: true,  revive: false, shrink: false, multiFood: true  },
  supreme:  { name: '至尊版', mode: 'smooth', selfDeath: false, revive: true,  shrink: true,  multiFood: true  },
};

// ---------- 手感与难度（想调难度就改这几个数） ----------
const BASE_SPEED = 130;        // 滑行版基础速度：像素/秒
const SPEED_GAIN = 0.015;      // 每得 1 分加速多少
const MAX_SPEED = 240;         // 滑行版速度上限
const TURN_RATE = 4.5;         // 滑行版转向灵敏度：弧度/秒
const BODY_W = 14;             // 滑行版蛇身粗细（像素）
const SHRINK_EVERY = 400;      // 每得多少分减一次身体
const SHRINK_BY = 100;         // 每次减掉多长（像素）
const MIN_LEN = 90;            // 减负后的最短身长

const isTouch = matchMedia('(pointer: coarse)').matches; // 手机/平板 = true

// ---------- 玩家数据（存在浏览器本地） ----------
let lifeLen = loadLifeLen();   // 累计长度：每局结束的身长，一辈子的账本
let games = loadGames();       // 总局数
let whiteBoard = loadWhite();  // 白玉棋盘开关

let best = loadBest();
bestEl.textContent = best;

let nick = loadNick();
nickBtn.textContent = '👤 ' + nick;

let verKey = loadVer();
let RULE = VERSIONS[verKey] || VERSIONS.supreme;

let skinIdx = loadSkin();
if (skinIdx === null || skinIdx < 0 || skinIdx >= SKINS.length || !skinUnlocked(SKINS[skinIdx])) {
  skinIdx = bestUnlockedIdx(); // 默认用最强皮肤
}

// ---------- 游戏内状态 ----------
let snake, foods, score, state, timer, rafId, lastT;
let dir, pendingDirs, speedMs;             // 格子版专用
let angle, targetAngle, steerPoint;        // 滑行版专用
let shrinkCount = 0, nextShrinkAt = SHRINK_EVERY;
let reviveUsed = false, adTimer = null;
let floats = [];        // 飘分动画
let incoming = null;    // 收到的好友挑战 { name, score }
let downT = 0, downP = null, downState = null;

// ---------- 读写存档 ----------
function loadBest() {
  try { return Number(localStorage.getItem('snake-best')) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('snake-best', String(v)); } catch {}
}
function loadNick() {
  try { return localStorage.getItem('snake-nick') || 'PWWJ'; } catch { return 'PWWJ'; }
}
function saveNick(v) {
  try { localStorage.setItem('snake-nick', v); } catch {}
}
function loadSkin() {
  try {
    const v = localStorage.getItem('snake-skin');
    return v === null || v === '' ? null : Number(v);
  } catch { return null; }
}
function saveSkin() {
  try { localStorage.setItem('snake-skin', String(skinIdx)); } catch {}
}
function loadLifeLen() {
  try { return Number(localStorage.getItem('snake-lifelen')) || 0; } catch { return 0; }
}
function saveLifeLen() {
  try { localStorage.setItem('snake-lifelen', String(lifeLen)); } catch {}
}
function loadGames() {
  try { return Number(localStorage.getItem('snake-games')) || 0; } catch { return 0; }
}
function saveGames() {
  try { localStorage.setItem('snake-games', String(games)); } catch {}
}
function loadWhite() {
  try { return localStorage.getItem('snake-white') === '1'; } catch { return false; }
}
function saveWhite() {
  try { localStorage.setItem('snake-white', whiteBoard ? '1' : '0'); } catch {}
}
function loadVer() {
  try { return localStorage.getItem('snake-ver') || 'supreme'; } catch { return 'supreme'; }
}
function saveVer() {
  try { localStorage.setItem('snake-ver', verKey); } catch {}
}

// ---------- 好友挑战：链接就是邀请函 ----------
function challengeURL() {
  return location.href.split('#')[0] + '#c=1&n=' + encodeURIComponent(nick) + '&s=' + score;
}

function showChallengeBanner() {
  if (!incoming) return;
  challengeText.textContent = '';
  const tag = document.createElement('b');
  tag.textContent = '⚡ 挑战：';
  challengeText.appendChild(tag);
  challengeText.appendChild(document.createTextNode(
    incoming.name + ' 拿了 ' + incoming.score + ' 分，你能赢吗？'));
  challengeEl.classList.remove('hidden');
}

function readIncomingChallenge() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.has('c') && params.get('n') && params.get('s')) {
    incoming = { name: params.get('n'), score: Number(params.get('s')) || 0 };
  }
}

challengeX.addEventListener('click', () => challengeEl.classList.add('hidden'));

// ---------- 复制工具 ----------
function copyText(text) {
  if (navigator.clipboard) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  if (!ok) prompt('手动复制下面的链接', text);
  return ok;
}

shareBtn.addEventListener('click', () => {
  copyText(challengeURL()).then(() => {
    const old = shareBtn.textContent;
    shareBtn.textContent = '✅ 已复制';
    setTimeout(() => { shareBtn.textContent = old; }, 2200);
  });
});

// ---------- 复活系统（至尊版专属）：看一段"广告"换一次重生 ----------
const ADS = [
  { icon: '🤖', text: '本广告位由一条蛇赞助播出：\n它说：别学了，来玩我。' },
  { icon: '🐍', text: '贪吃蛇减肥训练营：\n每 400 分剪一次腰，效果立竿见影。' },
  { icon: '📺', text: '广告位长期招租：\n第一条广告免费，有意者联系 PWWJ。' },
  { icon: '⭐', text: '天上的星星掉下来了：\n吃到一颗 +100 分，先到先得。' },
  { icon: '💉', text: '本局复活已就位：\n效果持续到下次撞墙为止。' },
];

const reviveBtn = document.getElementById('reviveBtn');
const reviveGo = document.getElementById('reviveGo');
const adSkip = document.getElementById('adSkip');
const adIcon = document.getElementById('ad-icon');
const adText = document.getElementById('ad-text');
const adSecEl = document.getElementById('ad-sec');

function openAd() {
  const ad = ADS[rand(ADS.length)];
  adIcon.textContent = ad.icon;
  adText.textContent = ad.text;
  let secs = 5;
  adSecEl.textContent = secs;
  reviveGo.disabled = true;
  reviveGo.textContent = '广告 ' + secs + ' 秒…';
  state = 'ad';
  showPage('page-ad');
  clearInterval(adTimer);
  adTimer = setInterval(() => {
    secs--;
    if (secs > 0) {
      adSecEl.textContent = secs;
      reviveGo.textContent = '广告 ' + secs + ' 秒…';
    } else {
      clearInterval(adTimer);
      reviveGo.disabled = false;
      reviveGo.textContent = '✨ 立即复活';
    }
  }, 1000);
}

adSkip.addEventListener('click', () => {

// 复活 = 在场地中央盘成一圈重生，分数、皮肤、减负进度全部保留
function reviveNow() {
  const L = Math.min(targetLen(), 500);
  const R = Math.max(30, L / (Math.PI * 2));
  const cx = W / 2, cy = W / 2;
  snake = [];
  const steps = Math.max(2, Math.ceil(L / 6));
  for (let i = 0; i <= steps; i++) {
    const a = -Math.PI / 2 + (i * 6) / R;
    snake.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R });
  }
  angle = 0;
  targetAngle = 0;
  steerPoint = null;
  state = 'running';
  overlay.classList.add('hidden');
  btn.textContent = '暂停';
  lastT = 0;
  rafId = requestAnimationFrame(loop);
  showFloat(cx, cy, '✨ 复活！');
}

// ---------- 排行榜（填了 LEADERBOARD 配置就自动激活） ----------
function lbEnabled() { return !!(LEADERBOARD.url && LEADERBOARD.key); }
function lbHeaders() {
  return { apikey: LEADERBOARD.key, Authorization: 'Bearer ' + LEADERBOARD.key, 'Content-Type': 'application/json' };
}

async function lbSubmit(name, scoreVal) {
  if (!lbEnabled() || scoreVal <= 0) return;
  try {
    const q = LEADERBOARD.url + '/rest/v1/scores?name=eq.' + encodeURIComponent(name) + '&select=score&order=score.desc&limit=1';
    const r = await fetch(q, { headers: lbHeaders() });
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length || scoreVal > rows[0].score) {
      await fetch(LEADERBOARD.url + '/rest/v1/scores', {
        method: 'POST',
        headers: lbHeaders(),
        body: JSON.stringify({ name, score: scoreVal }),
      });
    }
  } catch {}
}

async function lbFetchTop() {
  const q = LEADERBOARD.url + '/rest/v1/scores?select=name,score&order=score.desc&limit=20';
  const r = await fetch(q, { headers: lbHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ---------- 游戏世界 ----------
function skinUnlocked(s) {
  return s.rainbow ? lifeLen >= s.need : best >= s.need; // 炫彩看累计长度，普通皮肤看最高分
}
function bestUnlockedIdx() {
  let idx = 0;
  SKINS.forEach((s, i) => { if (!s.rainbow && best >= s.need) idx = i; });
  return idx;
}

function rand(n) { return Math.floor(Math.random() * n); }
function randRange(min, max) { return min + Math.random() * (max - min); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function currentSpeed() {
  return Math.min(MAX_SPEED, BASE_SPEED + score * SPEED_GAIN);
}

// 目标身长：分数越长越长，至尊版每过一关剪短一截
function targetLen() {
  return Math.max(MIN_LEN, 70 + score * 0.8 - (RULE.shrink ? shrinkCount * SHRINK_BY : 0));
}

function pathPx() {
  let total = 0;
  for (let i = 0; i < snake.length - 1; i++) total += dist(snake[i].x, snake[i].y, snake[i + 1].x, snake[i + 1].y);
  return total;
}

function reset() {
  score = 0;
  reviveUsed = false;
  shrinkCount = 0;
  nextShrinkAt = SHRINK_EVERY;
  scoreEl.textContent = score;
  foods = [];
  pendingDirs = [];
  dir = { x: 1, y: 0 };
  speedMs = 150;
  if (RULE.mode === 'grid') {
    snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }]; // 格子坐标，头在最前
  } else {
    snake = [];
    for (let i = 0; i < 8; i++) snake.push({ x: 240 - i * 9, y: 240 }); // 像素坐标
    angle = 0;
    targetAngle = 0;
    steerPoint = null;
  }
  fillFoods();
}

function pickType(types) {
  let roll = rand(100);
  for (const t of types) {
    if (roll < t.weight) return t;
    roll -= t.weight;
  }
  return types[0];
}

function fillFoods() {
  const want = RULE.multiFood ? FOOD_COUNT : 1;
  while (foods.length < want) spawnFood();
}

function spawnFood() {
  const types = RULE.multiFood ? FOOD_TYPES : [FOOD_TYPES[0]];
  const type = pickType(types);
  if (RULE.mode === 'grid') {
    for (let t = 0; t < 80; t++) {
      const x = rand(GRID), y = rand(GRID);
      const ok = !snake.some(s => s.x === x && s.y === y) &&
                 !foods.some(f => f.x === x && f.y === y);
      if (ok || t === 79) { foods.push({ x, y, type }); return; }
    }
  } else {
    const head = snake[0];
    for (let t = 0; t < 60; t++) {
      const x = randRange(28, W - 28), y = randRange(28, W - 28);
      if ((dist(x, y, head.x, head.y) > 80 && foods.every(f => dist(x, y, f.x, f.y) > 34)) || t === 59) {
        foods.push({ x, y, type });
        return;
      }
    }
  }
}

function start() {
  clearTimeout(timer);
  cancelAnimationFrame(rafId);
  reset();
  state = 'running';
  overlay.classList.add('hidden');
  btn.textContent = '暂停';
  resumeEngine();
}

function pauseEngine() {
  if (RULE.mode === 'smooth') cancelAnimationFrame(rafId);
  else clearTimeout(timer);
}

function resumeEngine() {
  lastT = 0;
  if (RULE.mode === 'smooth') rafId = requestAnimationFrame(loop);
  else timer = setTimeout(gridStep, speedMs);
}

function toggle() {
  if (state === 'running') {
    state = 'paused';
    pauseEngine();
    pauseHint.textContent = '喘口气。' + (isTouch ? '轻点屏幕' : '按 空格') + ' 继续';
    showPage('page-pause');
    btn.textContent = '继续';
  } else if (state === 'paused') {
    state = 'running';
    overlay.classList.add('hidden');
    btn.textContent = '暂停';
    resumeEngine();
  } else if (state === 'lobby' || state === 'over') {
    start();
  } else if (state === 'lb') {
    toLobby();
  }
}

function gameOver() {
  state = 'over';
  pauseEngine();
  const oldBest = best;
  if (score > best) {
    best = score;
    saveBest(best);
    bestEl.textContent = best;
  }
  // 累计长度账本：本局最后的身长记进一辈子
  const finalLen = RULE.mode === 'grid' ? snake.length * CELL : pathPx();
  const oldLife = lifeLen;
  lifeLen += Math.round(finalLen);
  games++;
  saveLifeLen();
  saveGames();
  let extra = '';
  if (incoming) {
    if (score > incoming.score) {
      extra = '🏆 你赢了 ' + incoming.name + '（TA：' + incoming.score + ' 分），复制链接反击回去！';
    } else if (score === incoming.score) {
      extra = '和 ' + incoming.name + ' 打平了，再来一局分出胜负！';
    } else {
      extra = '还差 ' + (incoming.score - score) + ' 分就能赢 ' + incoming.name + '，再来一局！';
    }
  }
  const newly = SKINS.filter(s => !s.rainbow && oldBest < s.need && s.need <= best).map(s => s.icon + ' ' + s.name);
  if (newly.length) extra += ' 🎁 解锁新皮肤：' + newly.join('、');
  const specials = [];
  if (oldLife < WHITE_NEED && lifeLen >= WHITE_NEED) specials.push('⬜ 白玉棋盘');
  if (oldLife < RAINBOW_NEED && lifeLen >= RAINBOW_NEED) specials.push('🌈 炫彩皮肤');
  if (specials.length) extra += ' 🎁 累计长度解锁：' + specials.join('、');
  overTitle.textContent = '游戏结束';
  overHint.textContent = RULE.name + ' · 本局得分 ' + score + ' · ' + (isTouch ? '轻点屏幕' : '按 空格') + ' 再来一局' + (extra ? '。' + extra : '');
  btn.textContent = '开始游戏';
  reviveBtn.classList.toggle('hidden', reviveUsed || !RULE.revive);
  showPage('page-over');
  lbSubmit(nick, score);
  updateStats();
}

// ---------- 滑行引擎主循环 ----------
function loop(t) {
  if (state !== 'running') return;
  if (!lastT) lastT = t;
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;

  // 1. 转向：朝目标方向平滑旋转
  if (steerPoint) targetAngle = Math.atan2(steerPoint.y - snake[0].y, steerPoint.x - snake[0].x);
  let diff = targetAngle - angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const maxTurn = TURN_RATE * dt;
  angle += Math.abs(diff) < maxTurn ? diff : Math.sign(diff) * maxTurn;

  // 2. 前进
  const head = snake[0];
  const nx = head.x + Math.cos(angle) * currentSpeed() * dt;
  const ny = head.y + Math.sin(angle) * currentSpeed() * dt;

  // 3. 撞墙判定：所有版本的死法之一
  const r = BODY_W / 2;
  if (nx < r || ny < r || nx > W - r || ny > W - r) {
    snake.unshift({ x: Math.max(r, Math.min(W - r, nx)), y: Math.max(r, Math.min(W - r, ny)) });
    trim();
    draw();
    gameOver();
    return;
  }

  // 4. 高级版：撞到自己 = 死（跳过贴着头的脖子部分）
  if (RULE.selfDeath) {
    for (let i = 14; i < snake.length; i++) {
      if (dist(nx, ny, snake[i].x, snake[i].y) < BODY_W * 0.55) {
        gameOver();
        return;
      }
    }
  }

  snake.unshift({ x: nx, y: ny });

  // 5. 吃东西（至尊版穿过自己毫无事情发生）
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    if (dist(nx, ny, f.x, f.y) < BODY_W / 2 + 10) {
      score += f.type.score;
      scoreEl.textContent = score;
      showFloat(f.x, f.y, '+' + f.type.score + (f.type.icon === '🍎' ? '' : ' ' + f.type.icon));
      foods.splice(i, 1);
      spawnFood();
    }
  }

  // 6. 减负机制：仅至尊版，每攒够 400 分剪一截
  if (RULE.shrink) {
    while (score >= nextShrinkAt) {
      nextShrinkAt += SHRINK_EVERY;
      shrinkCount++;
      showFloat(snake[0].x, snake[0].y, '✂️ 身体变短了');
    }
  }

  trim();
  draw();
  rafId = requestAnimationFrame(loop);
}

// 把尾巴超出目标身长的部分裁掉
function trim() {
  let total = 0;
  const want = targetLen();
  for (let i = 0; i < snake.length - 1; i++) {
    total += dist(snake[i].x, snake[i].y, snake[i + 1].x, snake[i + 1].y);
    if (total > want) {
      snake.length = i + 2;
      return;
    }
  }
}

// ---------- 格子引擎：每走一格 ----------
function gridStep() {
  if (state !== 'running') return;
  if (pendingDirs.length) {
    const d = pendingDirs.shift();
    if (d.x !== -dir.x || d.y !== -dir.y) dir = d; // 不许原地掉头
  }
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || (RULE.selfDeath && hitSelf)) { gameOver(); return; }

  snake.unshift(head);
  const fi = foods.findIndex(f => f.x === head.x && f.y === head.y);
  if (fi !== -1) {
    score += foods[fi].type.score;
    scoreEl.textContent = score;
    showFloat(head.x * CELL + 10, head.y * CELL + 10, '+' + foods[fi].type.score + (foods[fi].type.icon === '🍎' ? '' : ' ' + foods[fi].type.icon));
    foods.splice(fi, 1);
    spawnFood();
    speedMs = Math.max(110, speedMs - 3); // 吃到一点，快一点
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(gridStep, speedMs);
}

function queueDir(x, y) {
  const last = pendingDirs[pendingDirs.length - 1] || dir;
  if (x === last.x && y === last.y) return;
  if (x === -last.x && y === -last.y) return; // 掉头不允许
  if (pendingDirs.length < 3) pendingDirs.push({ x, y });
}

// ---------- 输入：鼠标 / 手指 / 键盘 ----------
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * W,
    y: (e.clientY - rect.top) / rect.height * W,
  };
}

canvas.addEventListener('pointermove', (e) => {
  if (state === 'running' && RULE.mode === 'smooth') steerPoint = canvasPoint(e);
});
canvas.addEventListener('pointerdown', (e) => {
  if (state !== 'running') return;
  downT = Date.now();
  downState = state;
  downP = canvasPoint(e);
  if (e.pointerType !== 'mouse' && RULE.mode === 'smooth') steerPoint = downP;
});
canvas.addEventListener('pointerup', (e) => {
  const p = canvasPoint(e);
  const wasTap = downState === 'running' && Date.now() - downT < 300 &&
                 downP && dist(p.x, p.y, downP.x, downP.y) < 12;
  // 格子版：非轻点的滑动 = 转向
  if (!wasTap && downState === 'running' && RULE.mode === 'grid' && e.pointerType !== 'mouse' && downP) {
    const dx = p.x - downP.x, dy = p.y - downP.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      if (Math.abs(dx) > Math.abs(dy)) queueDir(Math.sign(dx), 0);
      else queueDir(0, Math.sign(dy));
    }
  }
  downP = null;
  downState = null;
  steerPoint = null;
  if (wasTap) toggle();
});
canvas.addEventListener('pointerleave', () => { steerPoint = null; });

const KEYS = {
  ArrowUp:    { a: -Math.PI / 2, v: [0, -1] }, KeyW: { a: -Math.PI / 2, v: [0, -1] },
  ArrowDown:  { a: Math.PI / 2,  v: [0, 1] },  KeyS: { a: Math.PI / 2,  v: [0, 1] },
  ArrowLeft:  { a: Math.PI,      v: [-1, 0] }, KeyA: { a: Math.PI,      v: [-1, 0] },
  ArrowRight: { a: 0,            v: [1, 0] },  KeyD: { a: 0,            v: [1, 0] },
};

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return; // 打字时不抢键盘
  if (state === 'nick' || state === 'ver') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); return; }
  const k = KEYS[e.code];
  if (!k) return;
  e.preventDefault();
  if (state === 'lobby' || state === 'over') { start(); return; }
  if (state === 'running') {
    if (RULE.mode === 'grid') queueDir(k.v[0], k.v[1]);
    else { steerPoint = null; targetAngle = k.a; }
  }
});

// ---------- 飘分动画 ----------
function showFloat(x, y, text) {
  const s = document.createElement('span');
  s.className = 'float';
  s.textContent = text;
  s.style.left = (x / W * 100) + '%';
  s.style.top = (y / W * 100) + '%';
  boardWrap.appendChild(s);
  setTimeout(() => s.remove(), 850);
}

// ---------- 画面绘制 ----------
function draw() {
  const white = whiteBoard && lifeLen >= WHITE_NEED; // 白玉棋盘：解锁后才能开
  ctx.fillStyle = white ? '#f8fafc' : '#101a2e';
  ctx.fillRect(0, 0, W, W);
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if ((x + y) % 2 === 0) {
        ctx.fillStyle = white ? '#e8edf5' : '#13203a';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }
  // 食物
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of foods) {
    const fx = RULE.mode === 'grid' ? f.x * CELL + 10 : f.x;
    const fy = RULE.mode === 'grid' ? f.y * CELL + 10 : f.y;
    if (f.type.icon === '⭐') {
      const pulse = 8 + Math.sin(Date.now() / 200) * 3;
      ctx.strokeStyle = 'rgba(251, 191, 36, .5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(fx, fy, foodRadius(f) + pulse, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.font = Math.floor(20 * f.type.size) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.fillText(f.type.icon, fx, fy + 1);
  }
  // 蛇
  const s = SKINS[skinIdx];
  const t = Date.now() / 300;
  if (RULE.mode === 'grid') {
    for (let i = snake.length - 1; i >= 1; i--) {
      ctx.fillStyle = s.rainbow
        ? 'hsl(' + ((t * 40 + i * 12) % 360) + ', 80%, 55%)'
        : (i % 2 === 0 ? s.body1 : s.body2);
      fillCell(snake[i], 2, 5);
    }
    ctx.fillStyle = s.rainbow ? 'hsl(' + ((t * 40) % 360) + ', 85%, 60%)' : s.head;
    fillCell(snake[0], 1, 6);
  } else {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (s.rainbow) {
      for (let i = 0; i < snake.length - 1; i += 3) {
        ctx.strokeStyle = 'hsl(' + ((t * 40 + i * 6) % 360) + ', 80%, 55%)';
        ctx.lineWidth = BODY_W;
        ctx.beginPath();
        ctx.moveTo(snake[i].x, snake[i].y);
        for (let j = i + 1; j <= Math.min(i + 3, snake.length - 1); j++) ctx.lineTo(snake[j].x, snake[j].y);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(snake[0].x, snake[0].y);
      for (let i = 1; i < snake.length; i++) ctx.lineTo(snake[i].x, snake[i].y);
      ctx.strokeStyle = s.body2;
      ctx.lineWidth = BODY_W;
      ctx.stroke();
      ctx.strokeStyle = s.body1;
      ctx.lineWidth = BODY_W - 5;
      ctx.stroke();
    }
  }
  // 蛇头 + 眼睛
  const hc = RULE.mode === 'grid'
    ? { x: snake[0].x * CELL + 10, y: snake[0].y * CELL + 10 }
    : { x: snake[0].x, y: snake[0].y };
  const hv = RULE.mode === 'grid' ? dir : { x: Math.cos(angle), y: Math.sin(angle) };
  const headColor = s.rainbow ? 'hsl(' + ((t * 40) % 360) + ', 85%, 60%)' : s.head;
  ctx.save();
  ctx.shadowColor = headColor;
  ctx.shadowBlur = 12;
  ctx.fillStyle = headColor;
  ctx.beginPath();
  ctx.arc(hc.x, hc.y, (RULE.mode === 'grid' ? CELL : BODY_W) / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  const fx = hv.x * 4, fy = hv.y * 4;
  const px = -hv.y * 4, py = hv.x * 4;
  ctx.fillStyle = '#052e16';
  for (const side of [1, -1]) {
    ctx.beginPath();
    ctx.arc(hc.x + fx + px * side, hc.y + fy + py * side, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function fillCell(cell, inset, radius) {
  ctx.beginPath();
  const px = cell.x * CELL + inset, py = cell.y * CELL + inset;
  const size = CELL - inset * 2;
  if (ctx.roundRect) ctx.roundRect(px, py, size, size, radius);
  else ctx.rect(px, py, size, size);
  ctx.fill();
}

function foodRadius(f) {
  return 10 * f.type.size;
}

function updateHint() {
  if (RULE.mode === 'grid') {
    ctrlHint.textContent = isTouch
      ? '滑动屏幕转向 · 轻点暂停'
      : '方向键 / WASD 移动 · 空格暂停';
  } else {
    ctrlHint.textContent = isTouch
      ? '手指按住屏幕拖动，蛇会跟着手指走 · 轻点 = 暂停'
      : '移动鼠标控制方向 · 点击 = 暂停 · 空格 = 暂停';
  }
}

// ---------- 开机 ----------
readIncomingChallenge();
showChallengeBanner();
reset();
draw();
updateSkinLine();
updateStats();
syncWhiteBtn();
renderGallery();
updateHint();
// 第一次来先起名，老玩家直接选版本
let nickWasSet = false;
try { nickWasSet = !!localStorage.getItem('snake-nick-set'); } catch {}
if (nickWasSet) showVer();
else { state = 'nick'; nickInput.value = ''; showPage('page-nick'); }
</script>
