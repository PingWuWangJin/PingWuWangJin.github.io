<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间壳</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% 18%, #141b36, #0b1220 70%);
    color: #e2e8f0;
    font-family: system-ui, "Microsoft YaHei", serif; padding: 16px;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .game { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 19px; font-weight: 500; letter-spacing: 2px; }
  h1 span { color: #a78bfa; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    background: rgba(30, 41, 59, .8); border: 1px solid #2b3a55; border-radius: 999px;
    padding: 4px 11px; font-size: 12px; color: #94a3b8;
  }
  .chip b { color: #e2e8f0; font-weight: 500; }
  .board-wrap { position: relative; }
  canvas {
    display: block; width: min(480px, calc(100vw - 32px)); height: auto;
    background: #0d1526; border: 1px solid #2b3a55; border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(9, 12, 24, .92); backdrop-filter: blur(4px);
    border-radius: 14px; text-align: center; padding: 14px; z-index: 8;
  }
  .hidden { display: none !important; }
  .page { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .page h2 { font-size: 21px; font-weight: 500; }
  .page h2 span { color: #a78bfa; }
  .page p { font-size: 13px; color: #94a3b8; line-height: 1.75; }
  .btn-primary {
    background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; border: none; border-radius: 10px;
    padding: 11px 26px; font-size: 14px; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 18px rgba(124, 58, 237, .35);
  }
  .btn-primary:hover { filter: brightness(1.15); }
  .pad { display: flex; gap: 6px; width: 100%; max-width: 480px; }
  .pad button {
    flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px;
    padding: 12px 0; font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .pad button:active { background: #334155; }
  .hint { font-size: 12px; color: #64748b; text-align: center; }
  .fin-line {
    font-size: 14px; color: #cbd5e1; letter-spacing: 2px; line-height: 1.9;
    opacity: 0; transform: translateY(10px);
    animation: finIn 1.6s ease forwards;
  }
  .fin-line em { font-style: normal; color: #c4b5fd; }
  .fin-line.last { color: #e2e8f0; font-size: 15px; }
  @keyframes finIn { to { opacity: 1; transform: none; } }
  .fin-btn { opacity: 0; animation: finIn 1.4s ease 12.2s forwards; }
</style>
</head>
<body>
<main class="game">
  <div class="topbar">
    <h1>⏳ 时间<span>壳</span></h1>
    <div class="chips">
      <span class="chip">关卡 <b id="lv">1</b>/12</span>
      <span class="chip" id="lvname">「苏醒」</span>

      <span class="chip">试错 <b id="deaths">0</b></span>

    </div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="page" id="page-start">
        <h2>⏳ 时间<span>壳</span></h2>
        <p>这是一款和<b style="color:#c4b5fd">过去的自己</b>、也和<b style="color:#c4b5fd">历史中的人</b>合作的游戏。<br>
        你死后，生前的一秒会凝成"时间壳"——它循环重演你的动作，<br>
        可以替你踩住机关，也可以成为你的垫脚石。<br>
        每一层时间里，都有一位旅者。和他们说说话。</p>

  </div>

</main>

const BGM_SRC = 'bgm.mp3';
let bgm = null, bgmOn = true;
try { bgmOn = localStorage.getItem('time-bgm') !== '0'; } catch {}
function startBgm() {
  if (!bgmOn) return;
  try {
    if (!bgm) { bgm = new Audio(BGM_SRC); bgm.loop = true; bgm.volume = 0.32; }
    if (bgm.paused) bgm.play().catch(() => {});
  } catch {}
}
function stopBgm() { try { if (bgm) bgm.pause(); } catch {} }
const sndBtn = document.getElementById('sndBtn');
sndBtn.textContent = bgmOn ? '🔊' : '🔇';
sndBtn.addEventListener('click', () => {
  bgmOn = !bgmOn;
  try { localStorage.setItem('time-bgm', bgmOn ? '1' : '0'); } catch {}
  sndBtn.textContent = bgmOn ? '🔊' : '🔇';
  if (bgmOn) { if (state === 'playing') startBgm(); } else stopBgm();
});
function tone(freq, dur, type, vol, when) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    const t0 = AC.currentTime + (when || 0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch {}
}
function sfxJump() { tone(420, 0.08, 'square', 0.04); }
function sfxDie() { tone(200, 0.25, 'sawtooth', 0.07); tone(150, 0.2, 'sawtooth', 0.05, 0.1); }

function sfxDeny() { tone(160, 0.08, 'square', 0.05); }
function sfxTalk() { tone(880, 0.06, 'sine', 0.04); }
function sfxWin() { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'sine', 0.07, i * 0.28)); }

// ---------- 关卡审计（每次加载自动运行） ----------
function auditLevels() {
  const issues = [];
  const spBox = sp => [sp[0] + 3, sp[1] + sp[3] * 0.5, sp[2] - 6, sp[3] * 0.5];
  const inBox = (x, y, r, b) => x + r > b[0] && x - r < b[0] + b[2] && y + r > b[1] && y - r < b[1] + b[3];
  function fallTo(x, y, L) {
    let py = y, vy = 0;
    for (let f = 0; f < 400; f++) {
      vy += 25; py += vy;
      if (py > H + 40) return { y: H + 40, death: false, fell: true };
      for (const sp of (L.spikes || [])) {
        if (inBox(x, py + 9, 5, spBox(sp))) return { y: py, death: true };
      }
      let landed = false;
      for (const r of (L.plats || [])) {
        if (x + 7 > r[0] && x - 7 < r[0] + r[2] && py + 9 >= r[1] && py + 9 - vy <= r[1] + 4) {
          py = r[1] - 9; landed = true; break;
        }
      }
      if (landed) return { y: py, death: false };
    }
    return { y: py, death: false };
  }
  LEVELS.forEach((L, i) => {
    const tag = 'L' + (i + 1) + '「' + L.name + '」';
    const s = fallTo(L.spawn[0], L.spawn[1], L);
    if (s.death) issues.push(tag + ' 出生点下落即死（落点在尖刺里）');
    if (s.fell) issues.push(tag + ' 出生点下方无落脚点（会坠落出屏）');
    const e = fallTo(L.exit[0], L.exit[1] - 30, L);
    if (e.death) issues.push(tag + ' 出口下方是尖刺');
    if (e.fell) issues.push(tag + ' 出口悬空无支撑');
    (L.plates || []).forEach((p, k) => {
      const r = fallTo(p.x + p.w / 2, p.y - 4, L);
      if (r.death) issues.push(tag + ' 踩板' + String.fromCharCode(65 + k) + ' 下方是尖刺（无法站立）');
      if (r.fell) issues.push(tag + ' 踩板' + String.fromCharCode(65 + k) + ' 悬空无支撑');
    });
    (L.checks || []).forEach((c, k) => {
      const r = fallTo(c[0], c[1], L);
      if (r.death) issues.push(tag + ' 存档点' + (k + 1) + ' 下方是尖刺');
      if (r.fell) issues.push(tag + ' 存档点' + (k + 1) + ' 悬空');
    });
    const solids = (L.plats || []).concat((L.doors || []).map(d => [d.x, d.y, d.w, d.h]));
    for (let a = 0; a < solids.length; a++) {
      for (let b = a + 1; b < solids.length; b++) {
        const A = solids[a], B = solids[b];
        if (A[0] < B[0] + B[2] && A[0] + A[2] > B[0] && A[1] < B[1] + B[3] && A[1] + A[3] > B[1])
          issues.push(tag + ' 实体重叠 [' + A.join(',') + '] × [' + B.join(',') + ']');
      }
    }
    (L.doors || []).forEach((d, k) => {
      if (L.exit[0] + 13 > d.x && L.exit[0] - 13 < d.x + d.w)
        issues.push(tag + ' 出口在第' + (k + 1) + '扇门的范围内（门失去意义）');
    });
  });
  if (issues.length) console.warn('⚠️ 关卡审计 ' + issues.length + ' 个问题：' + issues.join('  |  '));
  else console.warn('✅ 关卡审计通过：' + LEVELS.length + ' 层全部无几何问题');
  return issues;
}
const AUDIT = auditLevels();

// ---------- 状态 ----------
let lvIdx = 0, deaths = 0;
let player, ghosts, rec, platesOpen, parts, npcs;
let shellCd = 0, checkX = null, checkY = null;
let camX = 0;
let state, rafId = 0, lastT = 0, shakeT = 0;
let keys = {};
let dlg = null, nearNpc = null;
let stars = [];
for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.4 + 0.3 });
let bgGrad = null, glowSprite = null;
function buildStatics() {
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#121a36');
  bgGrad.addColorStop(1, '#0d1526');
  glowSprite = document.createElement('canvas');

  const g2 = glowSprite.getContext('2d');

buildStatics();

// ---------- 存档与流程 ----------
function loadLevel(i) {
  player = { x: LEVELS[i].spawn[0], y: LEVELS[i].spawn[1], vx: 0, vy: 0, onGround: false, face: 1, sq: 0 };
  ghosts = [];
  rec = [];
  parts = [];
  platesOpen = LEVELS[i].plates.map(() => false);
  npcs = LEVELS[i].npcs || [];
  shellCd = 0; checkX = null; checkY = null; camX = 0;
  dlg = null; nearNpc = null;
  lvEl.textContent = i + 1;
  lvnameEl.textContent = '「' + LEVELS[i].name + '」';
  ghostsEl.textContent = 0;
}

function respawn(makeShell) {
  if (makeShell) {
    if (shellCd > 0) {
      showFloat(player.x, player.y - 20, '⏳ 冷却中');
    } else if (rec.length > 24) {
      // 空中留壳（影子凝固在按键位置）：仅"飞向蓝天"挑战层可用
      const buf = (LEVELS[lvIdx].star && !player.onGround && rec.length > 2) ? [rec[rec.length - 1]] : rec.slice();
      ghosts.push({ buf, t: 0 });
      if (ghosts.length > 8) ghosts.shift();
      ghostsEl.textContent = ghosts.length;
      shellCd = 1;
      sfxShell(); vib(25);
      for (let k = 0; k < 10; k++) parts.push({ x: player.x, y: player.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, life: 0.5, c: '#a78bfa' });
    } else {
      showFloat(player.x, player.y - 20, '⏳ 录制太短');
    }
  }
  rec = [];
  const rx = checkX !== null ? checkX : LEVELS[lvIdx].spawn[0];
  const ry = checkY !== null ? checkY : LEVELS[lvIdx].spawn[1];
  player = { x: rx, y: ry, vx: 0, vy: 0, onGround: false, face: 1, sq: 0 };
  dlg = null;
}

function die() {
  sfxDie(); vib(60);
  deaths++;
  deathsEl.textContent = deaths;
  shakeT = 0.25;
  for (let k = 0; k < 12; k++) parts.push({ x: player.x, y: player.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.5, c: '#f472b6' });
  respawn(true);
}

function doReset() {
  if (state !== 'playing' || dlg) return false;
  if (shellCd > 0) { sfxDeny(); showFloat(player.x, player.y - 22, '⏳ ' + shellCd.toFixed(1) + 's'); return false; }
  tone(300, 0.08, 'square', 0.04);
  respawn(true);
  return true;
}

function updateResetBtn() {
  pReset.textContent = shellCd > 0 ? '⏳ ' + shellCd.toFixed(1) + 's' : '⏪ 留壳';
  pReset.classList.toggle('cooling', shellCd > 0);
}

// ---------- 机关 ----------
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax + aw > bx && ax < bx + bw && ay + ah > by && ay < by + bh;
}
function solidRects() {
  const rects = LEVELS[lvIdx].plats.slice();
  LEVELS[lvIdx].doors.forEach((d, i) => { if (!platesOpen[i]) rects.push([d.x, d.y, d.w, d.h]); });
  return rects;
}
function updatePlates() {
  LEVELS[lvIdx].plates.forEach((p, i) => {
    let pressed = overlap(player.x - 7, player.y - 9, 14, 18, p.x, p.y, p.w, 12);
    for (const g of ghosts) {
      const pos = g.buf[Math.floor(g.t) % g.buf.length];
      if (pos && overlap(pos.x - 7, pos.y - 9, 14, 18, p.x, p.y, p.w, 12)) pressed = true;
    }
    if (pressed && !platesOpen[i]) { platesOpen[i] = true; sfxPlate(); vib(15); }
    if (!pressed) platesOpen[i] = false;
  });
}

// ---------- 对话 ----------
function openDlg(npc) {
  dlg = { npc, idx: 0 };
  sfxTalk();
}
function advanceDlg() {
  if (!dlg) return;
  dlg.idx++;
  if (dlg.idx >= dlg.npc.lines.length) dlg = null;
  if (dlg) sfxTalk();
}

// ---------- 物理 ----------
function step(dt) {
  if (shellCd > 0) { shellCd = Math.max(0, shellCd - dt); updateResetBtn(); }

  if (dlg) { draw(); return; } // 对话中：世界静止

  rec.push({ x: player.x, y: player.y });
  if (rec.length > 480) rec.splice(0, rec.length - 480);

  for (const g of ghosts) g.t += dt * 60;

  let mx = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  player.vx = mx * 250;
  if (mx !== 0) player.face = mx;
  if ((keys.ArrowUp || keys.Space) && player.onGround) {
    player.vy = -520;
    player.onGround = false;
    player.sq = -0.18;
    sfxJump(); vib(8);
  }
  player.vy += 1500 * dt;
  player.sq *= Math.pow(0.001, dt);

  const solids = solidRects();
  player.x += player.vx * dt;
  for (const r of solids) {
    if (overlap(player.x - 7, player.y - 9, 14, 18, r[0], r[1], r[2], r[3])) {
      if (player.vx > 0) player.x = r[0] - 7;
      else if (player.vx < 0) player.x = r[0] + r[2] + 7;
    }
  }
  const lw = LEVELS[lvIdx].width || W;
  player.x = Math.max(7, Math.min(lw - 7, player.x));

  const prevBottom = player.y + 9;
  player.y += player.vy * dt;
  const wasAir = !player.onGround;
  player.onGround = false;
  for (const r of solids) {
    if (overlap(player.x - 7, player.y - 9, 14, 18, r[0], r[1], r[2], r[3])) {
      if (player.vy > 0) {
        player.y = r[1] - 9; player.vy = 0; player.onGround = true;
        if (wasAir && player.sq < 0.05) player.sq = 0.16;
      } else if (player.vy < 0) { player.y = r[1] + r[3] + 9; player.vy = 0; }
    }
  }
  if (player.vy >= 0) {
    for (const g of ghosts) {
      const pos = g.buf[Math.floor(g.t) % g.buf.length];
      if (!pos) continue;
      const gtop = pos.y - 9;
      if (prevBottom <= gtop + 4 && player.y + 9 >= gtop &&
          player.x + 7 > pos.x - 7 && player.x - 7 < pos.x + 7) {
        player.y = gtop - 9;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  for (const g of ghosts) {
    const pos = g.buf[Math.floor(g.t) % g.buf.length];
    if (!pos) continue;
    if (Math.abs(player.y - pos.y) < 15 && Math.abs(player.x - pos.x) < 13 && Math.abs(player.y - pos.y) > 3) {
      player.x += Math.sign(player.x - pos.x || 1) * 90 * dt;
    }
  }
  for (const r of solidRects()) {
    if (overlap(player.x - 7, player.y - 9, 14, 18, r[0], r[1], r[2], r[3])) {
      const oL = player.x + 7 - r[0], oR = r[0] + r[2] - (player.x - 7);
      const oT = player.y + 9 - r[1], oB = r[1] + r[3] - (player.y - 9);
      const m = Math.min(oL, oR, oT, oB);
      if (m === oL) player.x = r[0] - 7;
      else if (m === oR) player.x = r[0] + r[2] + 7;
      else if (m === oT) player.y = r[1] - 9;
      else player.y = r[1] + r[3] + 9;
    }
  }
  for (const sp of (LEVELS[lvIdx].spikes || [])) {
    if (overlap(player.x - 5, player.y - 7, 10, 14, sp[0] + 3, sp[1] + sp[3] * 0.5, sp[2] - 6, sp[3] * 0.5)) { die(); return; }
  }
  if (player.y > H + 30) { die(); return; }

  updatePlates();

  // 摄像机跟随（长关卡横向滚动，可进可退）
  camX = Math.max(0, Math.min((LEVELS[lvIdx].width || W) - W, player.x - W / 2));
  for (const c of (LEVELS[lvIdx].checks || [])) {
    if ((checkX !== c[0] || checkY !== c[1]) && Math.hypot(player.x - c[0], player.y - c[1]) < 26) {
      checkX = c[0]; checkY = c[1];
      sfxShell(); vib(20);
      showFloat(c[0], c[1] - 34, '⏳ 存档点已激活');
      for (let k = 0; k < 8; k++) parts.push({ x: c[0], y: c[1], vx: (Math.random() - 0.5) * 150, vy: -Math.random() * 160, life: 0.6, c: '#7dd3fc' });
    }
  }

  // NPC 接近检测
  nearNpc = null;
  let nd = 48;
  for (const n of npcs) {
    const d = Math.hypot(n.x - player.x, n.y - player.y);
    if (d < nd) { nd = d; nearNpc = n; }
  }

  const ex = LEVELS[lvIdx].exit;
  if (Math.hypot(player.x - ex[0], player.y - ex[1]) < 26) {
    if (lvIdx === LEVELS.length - 1) {
      state = 'won';
      sfxWin(); vib(60);
      showFinale();
      return;
    }
    lvIdx++;
    loadLevel(lvIdx);
    tone(700, 0.1, 'square', 0.05); tone(900, 0.12, 'square', 0.05, 0.1);
  }
}

// ---------- 绘制 ----------
function drawGhostBody(x, y, alpha, face, color) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(x - 7, y - 9, x + 7, y + 9);
  g.addColorStop(0, color === '#94a3b8' ? 'rgba(226, 232, 240, .9)' : 'rgba(196, 181, 253, .95)');
  g.addColorStop(1, color || 'rgba(76, 29, 149, .95)');
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - 7, y - 9, 14, 18, 5); else ctx.rect(x - 7, y - 9, 14, 18);
  ctx.fill();
  ctx.fillStyle = 'rgba(232, 224, 255, .9)';
  ctx.beginPath();
  ctx.arc(x + face * 3, y - 3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  const L = LEVELS[lvIdx];
  const lw = L.width || W;
  ctx.save();
  if (shakeT > 0) { shakeT -= 1 / 60; ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9); }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-12, -12, W + 24, H + 24);
  ctx.fillStyle = 'rgba(148, 163, 184, .3)';
  for (const st of stars) {
    const sx = ((st.x - camX * 0.25) % W + W) % W;
    ctx.fillRect(sx, st.y, st.s, st.s);
  }
  const amb = ctx.createRadialGradient(W / 2, H / 3, 60, W / 2, H / 2, W);
  amb.addColorStop(0, 'rgba(124, 58, 237, .07)');
  amb.addColorStop(1, 'rgba(124, 58, 237, 0)');
  ctx.fillStyle = amb;
  ctx.fillRect(0, 0, W, H);
  // 世界层（随镜头滚动，可往回走，状态全保留）
  ctx.save();
  ctx.translate(-camX, 0);
  for (const r of L.plats) {
    if (r[0] + r[2] < camX - 40 || r[0] > camX + W + 40) continue;
    const g = ctx.createLinearGradient(0, r[1], 0, r[1] + r[3]);
    g.addColorStop(0, '#3b4c6b');
    g.addColorStop(1, '#232f47');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(r[0], r[1], r[2], r[3], 6); else ctx.rect(r[0], r[1], r[2], r[3]);
    ctx.fill();
    ctx.fillStyle = 'rgba(139, 156, 196, .5)';
    ctx.fillRect(r[0] + 2, r[1], r[2] - 4, 3);
    ctx.fillStyle = 'rgba(13, 21, 38, .5)';
    for (let sx = r[0] + 34; sx < r[0] + r[2] - 8; sx += 34) ctx.fillRect(sx, r[1] + 6, 2, r[3] - 10);
    if ((r[0] + r[1]) % 97 < 14) {
      ctx.fillStyle = 'rgba(125, 211, 252, .5)';
      ctx.fillRect(r[0] + 10, r[1] + r[3] / 2 - 2, 5, 5);
    }
  }
  L.doors.forEach((d, i) => {
    if (d.x + d.w < camX - 40 || d.x > camX + W + 40) return;
    if (platesOpen[i]) {
      ctx.strokeStyle = 'rgba(167, 139, 250, .55)';
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = -Date.now() / 40;
      ctx.lineWidth = 2;
      ctx.strokeRect(d.x, d.y, d.w, d.h);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(167, 139, 250, .12)';
      ctx.fillRect(d.x, d.y, d.w, d.h);
    } else {
      const g = ctx.createLinearGradient(d.x, d.y, d.x + d.w, d.y + d.h);
      g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#4c1d95');
      ctx.fillStyle = g;
      ctx.fillRect(d.x, d.y, d.w, d.h);
      ctx.fillStyle = 'rgba(226, 232, 240, .9)';
      ctx.font = '14px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔒', d.x + d.w / 2, d.y + d.h / 2);
      ctx.fillStyle = 'rgba(226,232,240,.55)';
      ctx.font = '10px system-ui';
      ctx.fillText(String.fromCharCode(65 + i), d.x + d.w / 2, d.y - 10);
    }
  });
  L.plates.forEach((p, i) => {
    const on = platesOpen[i];
    ctx.fillStyle = on ? '#fbbf24' : '#3d4c63';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x, p.y + (on ? 3 : 0), p.w, on ? 7 : 10, 3); else ctx.rect(p.x, p.y, p.w, 10);
    ctx.fill();
    ctx.fillStyle = on ? '#fbbf24' : '#64748b';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String.fromCharCode(65 + i), p.x + p.w / 2, p.y - 6);
  });
  for (const sp of L.spikes) {
    if (sp[0] + sp[2] < camX - 40 || sp[0] > camX + W + 40) continue;
    const n = Math.floor(sp[2] / 14);
    for (let i = 0; i < n; i++) {
      const g = ctx.createLinearGradient(sp[0], sp[1] + sp[3], sp[0] + 14, sp[1]);
      g.addColorStop(0, '#7f1d1d'); g.addColorStop(1, '#f87171');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(sp[0] + i * 14, sp[1] + sp[3]);
      ctx.lineTo(sp[0] + i * 14 + 7, sp[1] + 2);
      ctx.lineTo(sp[0] + i * 14 + 14, sp[1] + sp[3]);
      ctx.closePath();
      ctx.fill();
    }
  }
  // 存档井
  for (const c of (L.checks || [])) {
    if (c[0] + 20 < camX - 40 || c[0] > camX + W + 40) continue;
    const active = checkX === c[0] && checkY === c[1];
    ctx.fillStyle = '#2b3a55';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(c[0] - 11, c[1] - 2, 22, 9, 3); else ctx.rect(c[0] - 11, c[1] - 2, 22, 9);
    ctx.fill();
    const fl = active ? 9 + Math.sin(Date.now() / 130) * 2.5 : 4;
    const fg = ctx.createRadialGradient(c[0], c[1] - 10 - fl / 2, 1, c[0], c[1] - 10, fl + 6);
    fg.addColorStop(0, active ? 'rgba(125, 211, 252, .95)' : 'rgba(100, 116, 139, .5)');
    fg.addColorStop(1, 'rgba(125, 211, 252, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(c[0], c[1] - 10, fl + 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = active ? '#bae6fd' : '#94a3b8';
    ctx.beginPath();
    ctx.ellipse(c[0], c[1] - 10 - fl * 0.4, 3.5, fl * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // 旅者（NPC）
  for (const n of npcs) {
    if (n.x + 30 < camX - 40 || n.x > camX + W + 40) continue;
    const g = ctx.createLinearGradient(n.x - 9, n.y - 14, n.x + 9, n.y + 11);
    g.addColorStop(0, n.c);
    g.addColorStop(1, 'rgba(13, 21, 38, .9)');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(n.x - 9, n.y - 13, 18, 24, 7); else ctx.rect(n.x - 9, n.y - 13, 18, 24);
    ctx.fill();
    ctx.fillStyle = 'rgba(226, 232, 240, .75)';
    ctx.beginPath();
    ctx.arc(n.x, n.y - 6, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(226, 232, 240, .75)';
    ctx.fillText(n.name, n.x, n.y - 20);
    if (nearNpc === n && !dlg) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('💬', n.x, n.y - 34);
    }
  }
  // 出口（飞向蓝天 = 星光；其他层 = 旗帜）
  const ex = L.exit;
  if (L.star) {
    const pulse = Math.sin(Date.now() / 220) * 6;
    const beam = ctx.createLinearGradient(ex[0], ex[1], ex[0], H);
    beam.addColorStop(0, 'rgba(253, 230, 138, .3)');
    beam.addColorStop(1, 'rgba(253, 230, 138, 0)');
    ctx.fillStyle = beam;
    ctx.fillRect(ex[0] - 26, ex[1], 52, H - ex[1]);
    const g2 = ctx.createRadialGradient(ex[0], ex[1], 4, ex[0], ex[1], 60 + pulse);
    g2.addColorStop(0, 'rgba(253, 230, 138, .95)');
    g2.addColorStop(0.4, 'rgba(253, 230, 138, .35)');
    g2.addColorStop(1, 'rgba(253, 230, 138, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(ex[0], ex[1], 60 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '34px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🌟', ex[0], ex[1]);
  } else {
    ctx.save();
    ctx.translate(ex[0], ex[1]);
    ctx.rotate(Date.now() / 500);
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 2; a += 0.5) {
      const rr = 10 + a * 1.6;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.stroke();
    ctx.restore();
    ctx.font = '20px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚩', ex[0], ex[1]);
  }
  // 时间壳（你的影子）
  for (const g of ghosts) {
    const idx = Math.floor(g.t) % g.buf.length;
    const pos = g.buf[idx];
    if (!pos) continue;
    if (pos.x + 30 < camX - 40 || pos.x > camX + W + 40) continue;
    const fade = g.buf.length > 3 ? Math.min(1, idx / 8, (g.buf.length - idx) / 8) : 0.85;
    ctx.drawImage(glowSprite, pos.x - 26, pos.y - 26, 52, 52);
    drawGhostBody(pos.x, pos.y, 0.82 * fade, player.face, null);
  }
  for (const p of parts) {
    ctx.globalAlpha = p.life / 0.5;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // 玩家（兜帽旅者）
  const p = player;
  const sq = p.sq;
  const bw = 14 * (1 - sq * 0.6), bh = 18 * (1 + sq);
  const walking = p.vx !== 0 && p.onGround;
  const bobP = walking ? Math.sin(Date.now() / 70) * 1.2 : 0;
  const py = p.y + 9 - bh / 2 + bobP;
  if (p.onGround) {
    ctx.fillStyle = 'rgba(0, 0, 0, .3)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 9, 9, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const bodyG = ctx.createLinearGradient(p.x - 7, py, p.x + 7, py + bh);
  bodyG.addColorStop(0, '#f1f5f9');
  bodyG.addColorStop(1, '#7c8db5');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(p.x - bw / 2, py - bh / 2, bw, bh, 5); else ctx.rect(p.x - bw / 2, py - bh / 2, bw, bh);
  ctx.fill();
  ctx.fillStyle = '#dbe3f0';
  ctx.beginPath();
  ctx.arc(p.x, py - bh / 2 + 3, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, .6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(30, 41, 59, .9)';
  ctx.beginPath();
  ctx.arc(p.x, py - bh / 2 + 5, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#7dd3fc';
  ctx.beginPath();
  ctx.arc(p.x + p.face * 2, py - bh / 2 + 5, 1.4, 0, Math.PI * 2);
  ctx.arc(p.x + p.face * 5.5, py - bh / 2 + 5, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.fillStyle = '#a78bfa';
  ctx.translate(p.x - p.face * 2, py);
  ctx.rotate(Math.PI / 4);
  ctx.fillRect(-2.5, -2.5, 5, 5);
  ctx.restore();
  ctx.strokeStyle = '#f472b6';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(p.x - p.face * 4, py - bh / 2 + 5);
  ctx.lineTo(p.x - p.face * (10 + Math.abs(p.vx) * 0.02), py - bh / 2 + 6 + Math.sin(Date.now() / 90) * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(167, 139, 250, .2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < rec.length; i += 4) {
    if (i === 0) ctx.moveTo(rec[i].x, rec[i].y); else ctx.lineTo(rec[i].x, rec[i].y);
  }
  ctx.stroke();
  ctx.restore();
  // 对话面板（屏幕层）
  if (dlg) {
    const bx = 20, by = H - 122, bw2 = W - 40, bh2 = 102;
    ctx.fillStyle = 'rgba(9, 12, 24, .93)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw2, bh2, 12); else ctx.rect(bx, by, bw2, bh2);
    ctx.fill();
    ctx.strokeStyle = dlg.npc.c;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = dlg.npc.c;
    ctx.font = 'bold 13px system-ui';
    ctx.fillText(dlg.npc.name, bx + 16, by + 24);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '13px system-ui';
    const text = dlg.npc.lines[dlg.idx];
    const chars = Math.floor((bw2 - 32) / 13);
    for (let i = 0; i * chars < text.length; i++) {
      ctx.fillText(text.slice(i * chars, (i + 1) * chars), bx + 16, by + 46 + i * 19);
    }
    ctx.fillStyle = '#64748b';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText((dlg.idx + 1) + ' / ' + dlg.npc.lines.length + '  ▼', bx + bw2 - 14, by + bh2 - 10);
  }
}

function showFloat(x, y, text) {
  const s = document.createElement('span');
  s.textContent = text;
  s.style.cssText = 'position:absolute;left:' + ((x - camX) / W * 100) + '%;top:' + (y / H * 100) + '%;transform:translate(-50%,-50%);color:#c4b5fd;font-size:13px;font-weight:500;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6);z-index:5';
  boardWrap.appendChild(s);
  setTimeout(() => s.remove(), 900);
}

// ---------- 主循环 ----------
function loop() {
  if (state !== 'playing') return;
  const now = Date.now();
  if (!lastT) lastT = now;
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  step(dt);
  if (state !== 'playing') return;
  draw();
  rafId = requestAnimationFrame(loop);
}

// ---------- 输入 ----------
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (dlg) {
    if (['KeyE', 'ArrowDown', 'Space', 'Enter'].includes(e.code)) { e.preventDefault(); advanceDlg(); }
    return;
  }
  if (state !== 'playing') { if (e.code === 'Enter') begin(); return; }
  if ((e.code === 'KeyE' || e.code === 'ArrowDown') && nearNpc) { openDlg(nearNpc); return; }
  if (e.code === 'KeyR') doReset();
  if (e.code === 'Enter') begin();
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });
function bindHold(id, down, up) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); down(); });
  if (up) { el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); }
}
bindHold('pLeft', () => keys.ArrowLeft = true, () => keys.ArrowLeft = false);
bindHold('pRight', () => keys.ArrowRight = true, () => keys.ArrowRight = false);
bindHold('pJump', () => keys.ArrowUp = true, () => keys.ArrowUp = false);
bindHold('pReset', () => doReset());
bindHold('pTalk', () => { if (dlg) advanceDlg(); else if (nearNpc) openDlg(nearNpc); });

// ---------- 终章（圣洁动画 + 文案 + 圣咏） ----------
function finaleMusic() {
  const seq = [523, 659, 784, 659, 880, 1046, 784, 659, 523, 587, 659, 523, 440, 392, 0, 0,
               523, 659, 784, 659, 880, 1046, 880, 784, 659, 587, 523, 0, 440, 392, 0, 0];
  let i = 0;
  tone(110, 14, 'triangle', 0.03);
  const iv = setInterval(() => {
    if (i >= seq.length) { clearInterval(iv); return; }
    if (seq[i]) { tone(seq[i], 0.9, 'sine', 0.05); tone(seq[i] / 2, 1.1, 'triangle', 0.04); }
    i++;
  }, 620);
}

function showFinale() {
  const lines = [
    ['每一步登高，都踩着一段<em>旧的时间</em>。', 1.2],
    ['他们叫它失败。我叫它，<em>来路</em>。', 3.4],
    ['前人以熄灭自己为炬，照亮我未曾抵达的远方。', 5.6],
    ['而我，终将成为后来者脚下的——<em>又一级台阶</em>。', 7.8],
    ['人类就是这样，一寸一寸，拓宽了世界的边界。', 10.2],
    ['这一次，你试错了 <em>' + deaths + '</em> 次。每一次，都算数。', 12],
  ];
  const svg = `
  <svg viewBox="0 0 480 300" width="100%" style="max-width:420px;display:block;margin:0 auto">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9d5ff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="starG">
        <stop offset="0" stop-color="#fef9c3"/>
        <stop offset=".5" stop-color="#fde68a"/>
        <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="150" y="0" width="180" height="300" fill="url(#beam)" opacity="0">
      <animate attributeName="opacity" to="0.8" dur="2.2s" begin="0.4s" fill="freeze"/>
    </rect>
    ${[0, 1, 2, 3, 4].map(i => {
      const y = 250 - i * 42, x = 150 + i * 34;
      return '<g opacity="0"><animate attributeName="opacity" to="0.9" dur="0.9s" begin="' + (1.2 + i * 0.9) + 's" fill="freeze"/>' +
        '<rect x="' + x + '" y="' + y + '" width="26" height="34" rx="6" fill="#7c3aed" opacity="0.85"/>' +
        '<circle cx="' + (x + 13) + '" cy="' + (y - 6) + '" r="9" fill="#c4b5fd" opacity="0.9"/></g>';
    }).join('')}
    <g><rect x="60" y="256" width="22" height="30" rx="7" fill="#f8fafc"/><circle cx="71" cy="248" r="11" fill="#f8fafc"/>
      <animateTransform attributeName="transform" type="translate" dur="7s" begin="1.6s"
        values="0,0; 64,-42; 64,-42; 98,-84; 98,-84; 132,-126; 132,-126; 165,-168; 165,-168"
        keyTimes="0;0.14;0.28;0.4;0.5;0.62;0.72;0.85;1" calcMode="spline"
        keySplines="0.4 0 0.6 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"
        fill="freeze"/></g>
    <circle cx="285" cy="30" r="0" fill="url(#starG)">
      <animate attributeName="r" to="34" dur="1.6s" begin="6.4s" fill="freeze"/>
    </circle>
    <circle cx="285" cy="30" r="3" fill="#fffbeb" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.8s" begin="6.4s" fill="freeze"/>
    </circle>
  </svg>`;
  document.getElementById('fin-svg').innerHTML = svg;
  document.getElementById('fin-text').innerHTML = lines.map(([t, d], i) =>
    '<div class="fin-line' + (i === lines.length - 2 ? ' last' : '') + '" style="animation-delay:' + d + 's">' + t + '</div>').join('');
  finaleMusic();
  showPage('page-finale');
}

// ---------- 页面与开机 ----------
function showPage(id) {
  for (const p of overlay.querySelectorAll('.page')) p.classList.toggle('hidden', p.id !== id);
  overlay.classList.remove('hidden');
}
function begin() {
  loadLevel(lvIdx);
  state = 'playing';
  overlay.classList.add('hidden');
  startBgm();
  lastT = 0;
  rafId = requestAnimationFrame(loop);
}
document.getElementById('startBtn').addEventListener('click', () => { lvIdx = 0; deaths = 0; deathsEl.textContent = 0; begin(); });
document.getElementById('finaleBtn').addEventListener('click', () => { lvIdx = 0; deaths = 0; deathsEl.textContent = 0; begin(); });

const isTouch = matchMedia('(pointer: coarse)').matches;
document.getElementById('start-hint').textContent = isTouch
  ? '下方按钮操控 · 走近旅者按 💬 对话 · 门是通天的，只能靠壳'
  : '← → 移动 · ↑/空格 跳 · E 或 ↓ 对话 · R 留壳（1 秒冷却）';

// 自动化测试（第 2 关，全链路）
if (location.search.indexOf('autotest') >= 0) {
  lvIdx = 1;
  begin();
  cancelAnimationFrame(rafId);
  let ticks = 0, platesOpenMax = 0;
  const iv = setInterval(() => {
    ticks++;
    state = 'playing';
    keys.ArrowRight = (ticks >= 0 && ticks < 20) || (ticks >= 110 && ticks < 180);
    if (ticks === 100) doReset();
    step(0.016);
    platesOpenMax = Math.max(platesOpenMax, platesOpen.filter(Boolean).length);
    draw();
    if (ticks >= 220 || state !== 'playing') {
      clearInterval(iv);
      document.body.dataset.autotest = JSON.stringify({
        ghosts: ghosts.length, deaths, platesOpenMax, levelReached: lvIdx + 1, audit: AUDIT,
      });
      state = 'stopped';
    }
  }, 16);
}

// 自动化测试 2（第 12 层「回望长廊」）：向右走，验证摄像机跟随
if (location.search.indexOf('camtest') >= 0) {
  lvIdx = 11;
  begin();
  cancelAnimationFrame(rafId);
  let ticks = 0;
  const iv = setInterval(() => {
    ticks++;
    state = 'playing';
    keys.ArrowRight = ticks < 150;
    step(0.016);
    draw();
    if (ticks >= 150) {
      clearInterval(iv);
      document.body.dataset.autotest = JSON.stringify({
        camX: Math.round(camX), playerX: Math.round(player.x),
        width: LEVELS[lvIdx].width || W, cameraWorks: camX > 100,
      });
      state = 'stopped';
    }
  }, 16);
}

loadLevel(0);
state = 'ready';
draw();
</script>
